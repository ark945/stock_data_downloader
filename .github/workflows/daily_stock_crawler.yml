name: 每日全市場券商分點爬蟲排程 (TWSE 6-Runner + TPEX 8-Runner + 全市場整合)

env:
  TZ: "Asia/Taipei"
  PYTHONIOENCODING: "utf-8"

on:
  # =========================================================================
  # 【GitHub 內建排程已關閉】改由外部 Cron-job.org 精準定時 Webhook 觸發
  # 若未來想重新啟用 GitHub 內建排程，解除下方註解即可：
  # =========================================================================
  # schedule:
  #   # 1. 主要排程：每週一至週五 台灣時間 18:37 (UTC 10:37)
  #   - cron: "37 10 * * 1-5"
  #   # 2. 二次備援排程：每週二至週六 台灣時間 05:31 (UTC 21:31)
  #   - cron: "31 21 * * 1-5"

  workflow_dispatch:
    inputs:
      target_date:
        description: "指定抓取日期 (YYYY-MM-DD，留空則自動判斷最新交易日)"
        required: false
        default: ""
      market:
        description: "抓取市場 (all / twse / tpex)"
        required: true
        default: "all"

jobs:
  # -----------------------------------------------------------------
  # 前置極速檢查：3 秒查詢 Google Drive 是否已有當日資料 (已存在則跳過後續)
  # -----------------------------------------------------------------
  pre-check:
    name: 檢查 Google Drive 雲端資料庫狀態
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_skip: ${{ steps.check.outputs.should_skip }}
      target_date: ${{ steps.check.outputs.target_date }}

    steps:
      - name: 檢出專案代碼 (Checkout)
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安裝檢查依賴
        run: |
          pip install requests google-api-python-client google-auth

      - name: 判斷今日是否為台股營業日 (Trading Day Pre-check)
        id: trading_day_check
        run: |
          TARGET="${{ github.event.inputs.target_date }}"
          EVENT="${{ github.event_name }}"
          FORCE="${{ secrets.FORCE_CRAWL }}"
          
          if [ "$EVENT" = "workflow_dispatch" ] && [ -n "$TARGET" ]; then
            echo "[*] 手動指定日期 ($TARGET)，繼續後續流程。"
            echo "is_open=true" >> $GITHUB_OUTPUT
          elif [ "$FORCE" = "true" ]; then
            echo "[*] 檢測到 FORCE_CRAWL 旗標，繼續後續流程。"
            echo "is_open=true" >> $GITHUB_OUTPUT
          else
            if python trading_calendar.py --check-today; then
              echo "is_open=true" >> $GITHUB_OUTPUT
            else
              echo "is_open=false" >> $GITHUB_OUTPUT
              echo "[⏸️] 本日非台股開盤營業日，休市自動跳過後續所有抓取作業！"
            fi
          fi

      - name: 查詢 Google Drive 目標資料夾
        id: check
        env:
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          GDRIVE_UPLOAD_URL: ${{ secrets.GDRIVE_UPLOAD_URL }}
          GDRIVE_SERVICE_ACCOUNT_KEY: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_KEY }}
          SPECIFIED_DATE: ${{ github.event.inputs.target_date }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ -f "check_gdrive_exists.py" ]; then
            CHECK_SCRIPT="check_gdrive_exists.py"
          else
            CHECK_SCRIPT="stock_data_downloader/check_gdrive_exists.py"
          fi

          # 若為手動指定日期且由使用者手動點擊 workflow_dispatch 觸發，不強制跳過
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$SPECIFIED_DATE" ]; then
            echo "should_skip=false" >> $GITHUB_OUTPUT
            echo "target_date=$SPECIFIED_DATE" >> $GITHUB_OUTPUT
            echo "[*] 手動強制指定日期 ($SPECIFIED_DATE)，略過自動快篩，強制執行採集。"
          else
                      # 若經由營業日檢查判定為休市日，直接設定 should_skip 並跳過
          if [ "${{ steps.trading_day_check.outputs.is_open }}" = "false" ]; then
            echo "should_skip=true" >> $GITHUB_OUTPUT
            echo "target_date=$(python trading_calendar.py --latest 2>/dev/null || date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
            echo "[*] 休市日標記 should_skip=true，優雅跳過本日全部爬蟲排程。"
            exit 0
          fi

          python "$CHECK_SCRIPT" "$SPECIFIED_DATE"
          fi

  # -----------------------------------------------------------------
  # 收盤價：單一輕量節點，單次 API 請求即可取得 TWSE+TPEX 全市場收盤行情
  # (無需瀏覽器自動化或分片，與分點爬蟲並行執行，互不影響)
  # -----------------------------------------------------------------
  close-price:
    name: 每日收盤價採集 (TWSE + TPEX)
    needs: pre-check
    if: ${{ needs.pre-check.outputs.should_skip != 'true' && (github.event_name == 'schedule' || github.event.inputs.market == 'all' || github.event.inputs.market == 'twse' || github.event.inputs.market == 'tpex' || github.event.inputs.market == '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 檢出專案代碼 (Checkout)
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 安裝 Python 套件依賴 (僅需 requests / pandas / pyarrow)
        run: |
          pip install requests pandas pyarrow google-api-python-client google-auth

      - name: 執行收盤價與輕量數據補齊爬蟲 (收盤價 + 融資券 + 期貨 + 集保)
        continue-on-error: true
        env:
          PYTHONIOENCODING: "utf-8"
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          GDRIVE_UPLOAD_URL: ${{ secrets.GDRIVE_UPLOAD_URL }}
          GDRIVE_SERVICE_ACCOUNT_KEY: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_KEY }}
          TARGET_DATE: ${{ github.event.inputs.target_date || needs.pre-check.outputs.target_date }}
        run: |
          if [ -n "$TARGET_DATE" ]; then
            python reconcile_lightweight_crawlers.py --date "$TARGET_DATE"
          else
            python reconcile_lightweight_crawlers.py
          fi

      - name: 上傳輕量數據產物 (Parquet)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lightweight-data-parquet
          path: |
            output/api_close1_*.parquet
            output_margin/api_margin_*.parquet
            output_taifex/api_taifex_*.parquet
            output_tdcc/api_tdcc_*.parquet
          retention-days: 7

  # -----------------------------------------------------------------
  # TWSE 上市：6 個獨立 shard；不做瀏覽器不受 CF 影響
  # -----------------------------------------------------------------
  twse-shards:
    name: TWSE-上市-分片-${{ matrix.shard }}
    needs: pre-check
    if: ${{ needs.pre-check.outputs.should_skip != 'true' && (github.event_name == 'schedule' || github.event.inputs.market == 'all' || github.event.inputs.market == 'twse' || github.event.inputs.market == '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]

    steps:
      - name: 檢出專案代碼 (Checkout)
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 安裝 Python 套件依賴
        run: |
          python -m pip install --upgrade pip
          if [ -f "requirements.txt" ]; then
            pip install -r requirements.txt
          else
            pip install -r stock_data_downloader/requirements.txt
          fi

      - name: 執行 TWSE 分片爬蟲 (Shard ${{ matrix.shard }})
        env:
          PYTHONIOENCODING: "utf-8"
          TARGET_DATE: ${{ github.event.inputs.target_date || needs.pre-check.outputs.target_date }}
        run: |
          if [ -f "stock_crawler_coordinator.py" ]; then
            TARGET_SCRIPT="stock_crawler_coordinator.py"
          else
            TARGET_SCRIPT="stock_data_downloader/stock_crawler_coordinator.py"
          fi

          if [ -n "$TARGET_DATE" ]; then
            python "$TARGET_SCRIPT" --market twse --date "$TARGET_DATE" --workers 4 --max-rounds 6 --shard-id ${{ matrix.shard }} --num-shards 6 --no-excel
          else
            python "$TARGET_SCRIPT" --market twse --workers 4 --max-rounds 6 --shard-id ${{ matrix.shard }} --num-shards 6 --no-excel
          fi

      - name: 上傳 TWSE 分片產物 (Parquet 與 Log)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twse-shard-${{ matrix.shard }}
          path: |
            **/output/*_twse_shard_*.parquet
            **/output/logs/crawler_twse_shard_*.log
            **/logs/crawler_twse_shard_*.log
          retention-days: 1

  # -----------------------------------------------------------------
  # TPEX 前置探針：先用單一 Runner 少量標的驗證 WARP / Turnstile / Session 可用，成功才展開 8-shard 矩陣
  # -----------------------------------------------------------------
  tpex-probe:
    name: TPEX-上櫃-雲端探針
    needs: pre-check
    if: ${{ needs.pre-check.outputs.should_skip != 'true' && (github.event_name == 'schedule' || github.event.inputs.market == 'all' || github.event.inputs.market == 'tpex' || github.event.inputs.market == '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 檢出專案代碼 (Checkout)
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 安裝系統依賴、Cloudflare WARP 通道與啟動 Xvfb 虛擬桌面
        run: |
          sudo apt-get update
          sudo apt-get install -y curl gpg lsb-release xvfb

          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list

          sudo apt-get update
          sudo apt-get install -y cloudflare-warp

          warp-cli --accept-tos registration new || warp-cli --accept-tos register
          warp-cli --accept-tos mode warp
          warp-cli --accept-tos connect

          sleep 3
          Xvfb :99 -screen 0 1920x1080x24 &
          sleep 1

      - name: 安裝 Python 套件依賴
        run: |
          python -m pip install --upgrade pip
          if [ -f "requirements_tpex_cloud.txt" ]; then
            pip install -r requirements_tpex_cloud.txt
          elif [ -f "stock_data_downloader/requirements_tpex_cloud.txt" ]; then
            pip install -r stock_data_downloader/requirements_tpex_cloud.txt
          elif [ -f "requirements.txt" ]; then
            pip install -r requirements.txt
          else
            pip install -r stock_data_downloader/requirements.txt
          fi

      - name: 執行 TPEX 雲端探針 (Shard 0 前 5 檔)
        env:
          DISPLAY: ":99"
          PYTHONIOENCODING: "utf-8"
          PYTHONUNBUFFERED: "1"
          TPEX_CI_ABORT_AFTER_CONSECUTIVE_FAILURES: "2"
          TPEX_PROBE_ATTEMPTS: "3"
          TPEX_PROBE_RETRY_COOLDOWN_SECONDS: "300"
          TARGET_DATE: ${{ github.event.inputs.target_date || needs.pre-check.outputs.target_date }}
        run: |
          if [ -f "stock_crawler_coordinator.py" ]; then
            TARGET_SCRIPT="stock_crawler_coordinator.py"
          else
            TARGET_SCRIPT="stock_data_downloader/stock_crawler_coordinator.py"
          fi

          ATTEMPTS="${TPEX_PROBE_ATTEMPTS:-3}"
          COOLDOWN="${TPEX_PROBE_RETRY_COOLDOWN_SECONDS:-300}"
          set +e
          for attempt in $(seq 1 "$ATTEMPTS"); do
            echo "[*] TPEX probe attempt ${attempt}/${ATTEMPTS}"
            if [ -n "$TARGET_DATE" ]; then
              python "$TARGET_SCRIPT" --market tpex --date "$TARGET_DATE" --workers 1 --max-rounds 1 --shard-id 0 --num-shards 8 --limit-symbols 5 --no-excel
            else
              python "$TARGET_SCRIPT" --market tpex --workers 1 --max-rounds 1 --shard-id 0 --num-shards 8 --limit-symbols 5 --no-excel
            fi
            rc=$?
            if [ "$rc" -eq 0 ]; then
              echo "[✓] TPEX probe attempt ${attempt}/${ATTEMPTS} passed."
              exit 0
            fi

            echo "[!] TPEX probe attempt ${attempt}/${ATTEMPTS} failed with exit code ${rc}."
            if [ "$attempt" -lt "$ATTEMPTS" ]; then
              echo "[*] Cooling down ${COOLDOWN}s and rotating WARP/Chromium before retry..."
              pkill -9 -f 'chrome|chromium' 2>/dev/null || true
              warp-cli --accept-tos disconnect 2>/dev/null || true
              sleep 8
              warp-cli --accept-tos connect 2>/dev/null || true
              sleep "$COOLDOWN"
            fi
          done

          echo "[!] TPEX probe failed after ${ATTEMPTS} attempts."
          exit 1

      - name: 上傳 TPEX 探針 Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tpex-probe-log
          path: |
            **/output/logs/crawler_tpex_shard_0.log
            **/logs/crawler_tpex_shard_0.log
          retention-days: 1

  # -----------------------------------------------------------------
  # TPEX 長跑金絲雀：probe 成功後，先完整跑 shard 0 (~125 檔)，成功才展開其餘 7 個 shard
  # -----------------------------------------------------------------
  tpex-canary:
    name: TPEX-上櫃-完整分片金絲雀-0
    needs: [pre-check, tpex-probe]
    if: ${{ needs.pre-check.outputs.should_skip != 'true' && needs.tpex-probe.result == 'success' && (github.event_name == 'schedule' || github.event.inputs.market == 'all' || github.event.inputs.market == 'tpex' || github.event.inputs.market == '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 檢出專案代碼 (Checkout)
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 安裝系統依賴、Cloudflare WARP 通道與啟動 Xvfb 虛擬桌面
        run: |
          sudo apt-get update
          sudo apt-get install -y curl gpg lsb-release xvfb

          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list

          sudo apt-get update
          sudo apt-get install -y cloudflare-warp

          warp-cli --accept-tos registration new || warp-cli --accept-tos register
          warp-cli --accept-tos mode warp
          warp-cli --accept-tos connect

          sleep 3
          Xvfb :99 -screen 0 1920x1080x24 &
          sleep 1

      - name: 安裝 Python 套件依賴
        run: |
          python -m pip install --upgrade pip
          if [ -f "requirements_tpex_cloud.txt" ]; then
            pip install -r requirements_tpex_cloud.txt
          elif [ -f "stock_data_downloader/requirements_tpex_cloud.txt" ]; then
            pip install -r stock_data_downloader/requirements_tpex_cloud.txt
          elif [ -f "requirements.txt" ]; then
            pip install -r requirements.txt
          else
            pip install -r stock_data_downloader/requirements.txt
          fi

      - name: 執行 TPEX 上櫃完整分片金絲雀 (Shard 0/8)
        env:
          DISPLAY: ":99"
          PYTHONIOENCODING: "utf-8"
          PYTHONUNBUFFERED: "1"
          TPEX_CI_ABORT_AFTER_CONSECUTIVE_FAILURES: "0"
          TPEX_SHARD_ATTEMPTS: "2"
          TPEX_SHARD_RETRY_COOLDOWN_SECONDS: "300"
          TARGET_DATE: ${{ github.event.inputs.target_date || needs.pre-check.outputs.target_date }}
        run: |
          if [ -f "stock_crawler_coordinator.py" ]; then
            TARGET_SCRIPT="stock_crawler_coordinator.py"
          else
            TARGET_SCRIPT="stock_data_downloader/stock_crawler_coordinator.py"
          fi

          ATTEMPTS="${TPEX_SHARD_ATTEMPTS:-2}"
          COOLDOWN="${TPEX_SHARD_RETRY_COOLDOWN_SECONDS:-300}"
          set +e
          for attempt in $(seq 1 "$ATTEMPTS"); do
            echo "[*] TPEX canary shard attempt ${attempt}/${ATTEMPTS}"
            if [ -n "$TARGET_DATE" ]; then
              python "$TARGET_SCRIPT" --market tpex --date "$TARGET_DATE" --workers 1 --max-rounds 3 --shard-id 0 --num-shards 8 --no-excel
            else
              python "$TARGET_SCRIPT" --market tpex --workers 1 --max-rounds 3 --shard-id 0 --num-shards 8 --no-excel
            fi
            rc=$?
            if [ "$rc" -eq 0 ]; then
              echo "[✓] TPEX canary shard attempt ${attempt}/${ATTEMPTS} passed."
              exit 0
            fi

            echo "[!] TPEX canary shard attempt ${attempt}/${ATTEMPTS} failed with exit code ${rc}."
            if [ "$attempt" -lt "$ATTEMPTS" ]; then
              echo "[*] Cooling down ${COOLDOWN}s and rotating WARP/Chromium before retrying canary shard..."
              rm -rf output/*.parquet output/logs/crawler_tpex_shard_0.log logs/crawler_tpex_shard_0.log downloads_tpex_cloud || true
              pkill -9 -f 'chrome|chromium' 2>/dev/null || true
              warp-cli --accept-tos disconnect 2>/dev/null || true
              sleep 8
              warp-cli --accept-tos connect 2>/dev/null || true
              sleep "$COOLDOWN"
            fi
          done

          echo "[!] TPEX canary shard failed after ${ATTEMPTS} attempts."
          exit 1

      - name: 上傳 TPEX 金絲雀分片產物 (Parquet 與 Log)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tpex-shard-0
          path: |
            **/output/*_tpex_shard_0.parquet
            **/output/logs/crawler_tpex_shard_0.log
            **/logs/crawler_tpex_shard_0.log
          retention-days: 1

  # -----------------------------------------------------------------
  # TPEX 上櫃：canary 成功後依序執行剩餘 shard；避免多 Runner 同時觸發 TPEX 後端保護性逾時
  # -----------------------------------------------------------------
  tpex-shards:
    name: TPEX-上櫃-分片-${{ matrix.shard }}
    needs: [pre-check, tpex-probe, tpex-canary]
    if: ${{ needs.pre-check.outputs.should_skip != 'true' && needs.tpex-probe.result == 'success' && needs.tpex-canary.result == 'success' && (github.event_name == 'schedule' || github.event.inputs.market == 'all' || github.event.inputs.market == 'tpex' || github.event.inputs.market == '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7]

    steps:
      - name: 檢出專案代碼 (Checkout)
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 安裝系統依賴、Cloudflare WARP 通道與啟動 Xvfb 虛擬桌面
        run: |
          sudo apt-get update
          sudo apt-get install -y curl gpg lsb-release xvfb

          # 安裝並啟動 Cloudflare 官方 WARP 網絡（獲取最高信譽消費者 Egress IP，徹底解鎖 Turnstile）
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list

          sudo apt-get update
          sudo apt-get install -y cloudflare-warp

          warp-cli --accept-tos registration new || warp-cli --accept-tos register
          warp-cli --accept-tos mode warp
          warp-cli --accept-tos connect

          sleep 3
          Xvfb :99 -screen 0 1920x1080x24 &
          sleep 1

      - name: 安裝 Python 套件依賴
        run: |
          python -m pip install --upgrade pip
          if [ -f "requirements_tpex_cloud.txt" ]; then
            pip install -r requirements_tpex_cloud.txt
          elif [ -f "stock_data_downloader/requirements_tpex_cloud.txt" ]; then
            pip install -r stock_data_downloader/requirements_tpex_cloud.txt
          elif [ -f "requirements.txt" ]; then
            pip install -r requirements.txt
          else
            pip install -r stock_data_downloader/requirements.txt
          fi

      - name: 執行 TPEX 上櫃分片爬蟲 (Shard ${{ matrix.shard }}/8)
        env:
          DISPLAY: ":99"
          PYTHONIOENCODING: "utf-8"
          PYTHONUNBUFFERED: "1"
          TPEX_CI_ABORT_AFTER_CONSECUTIVE_FAILURES: "0"
          TPEX_SHARD_ATTEMPTS: "2"
          TPEX_SHARD_RETRY_COOLDOWN_SECONDS: "300"
          TARGET_DATE: ${{ github.event.inputs.target_date || needs.pre-check.outputs.target_date }}
        run: |
          if [ -f "stock_crawler_coordinator.py" ]; then
            TARGET_SCRIPT="stock_crawler_coordinator.py"
          else
            TARGET_SCRIPT="stock_data_downloader/stock_crawler_coordinator.py"
          fi

          # 8 分片錯峰啟動 (每分片錯開 15s) 避免同時撞擊 TPEX 首頁與 Session 握手
          sleep $(( ${{ matrix.shard }} * 15 ))

          ATTEMPTS="${TPEX_SHARD_ATTEMPTS:-2}"
          COOLDOWN="${TPEX_SHARD_RETRY_COOLDOWN_SECONDS:-300}"
          set +e
          for attempt in $(seq 1 "$ATTEMPTS"); do
            echo "[*] TPEX shard ${{ matrix.shard }} attempt ${attempt}/${ATTEMPTS}"
            if [ -n "$TARGET_DATE" ]; then
              python "$TARGET_SCRIPT" --market tpex --date "$TARGET_DATE" --workers 1 --max-rounds 3 --shard-id ${{ matrix.shard }} --num-shards 8 --no-excel
            else
              python "$TARGET_SCRIPT" --market tpex --workers 1 --max-rounds 3 --shard-id ${{ matrix.shard }} --num-shards 8 --no-excel
            fi
            rc=$?
            if [ "$rc" -eq 0 ]; then
              echo "[✓] TPEX shard ${{ matrix.shard }} attempt ${attempt}/${ATTEMPTS} passed."
              exit 0
            fi

            echo "[!] TPEX shard ${{ matrix.shard }} attempt ${attempt}/${ATTEMPTS} failed with exit code ${rc}."
            if [ "$attempt" -lt "$ATTEMPTS" ]; then
              echo "[*] Cooling down ${COOLDOWN}s and rotating WARP/Chromium before retrying shard ${{ matrix.shard }}..."
              rm -rf output/*_tpex_shard_${{ matrix.shard }}.parquet output/logs/crawler_tpex_shard_${{ matrix.shard }}.log logs/crawler_tpex_shard_${{ matrix.shard }}.log downloads_tpex_cloud || true
              pkill -9 -f 'chrome|chromium' 2>/dev/null || true
              warp-cli --accept-tos disconnect 2>/dev/null || true
              sleep 8
              warp-cli --accept-tos connect 2>/dev/null || true
              sleep "$COOLDOWN"
            fi
          done

          echo "[!] TPEX shard ${{ matrix.shard }} failed after ${ATTEMPTS} attempts."
          exit 1

      - name: 上傳 TPEX 分片產物 (Parquet 與 Log)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tpex-shard-${{ matrix.shard }}
          path: |
            **/output/*_tpex_shard_*.parquet
            **/output/logs/crawler_tpex_shard_*.log
            **/logs/crawler_tpex_shard_*.log
          retention-days: 1

  # -----------------------------------------------------------------
  # 聚合 TWSE：聚合分片 Parquet 並彙整 YYYY-MM-DD-twse.log 上傳 GDrive
  # -----------------------------------------------------------------
  merge-twse:
    name: 聚合 TWSE 上市資料庫與 Log 歸檔
    needs: [pre-check, twse-shards]
    if: ${{ always() && needs.pre-check.outputs.should_skip != 'true' && needs.twse-shards.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 檢出專案代碼 (Checkout)
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 安裝 Python 套件依賴
        run: |
          python -m pip install --upgrade pip
          if [ -f "requirements.txt" ]; then
            pip install -r requirements.txt
          else
            pip install -r stock_data_downloader/requirements.txt
          fi

      - name: 下載 TWSE 分片產物
        uses: actions/download-artifact@v4
        with:
          pattern: twse-shard-*
          path: download_shards

      - name: 彙整 TWSE 分片為上市完整資料庫與 Log
        env:
          PYTHONIOENCODING: "utf-8"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GDRIVE_UPLOAD_URL: ${{ secrets.GDRIVE_UPLOAD_URL }}
          GDRIVE_SERVICE_ACCOUNT_KEY: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_KEY }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          GDRIVE_LOG_FOLDER_ID: ${{ secrets.GDRIVE_LOG_FOLDER_ID }}
          SMTP_SERVER: "smtp.gmail.com"
          SMTP_PORT: "587"
          SENDER_EMAIL: ${{ secrets.SMTP_USER }}
          SENDER_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          TARGET_DATE: ${{ github.event.inputs.target_date || needs.pre-check.outputs.target_date }}
        run: |
          mkdir -p download_shards output/logs
          find download_shards . -name "*_twse_shard_*.parquet" -exec cp {} output/ \; 2>/dev/null || true
          find download_shards . -name "crawler_twse_shard_*.log" -exec cp {} output/logs/ \; 2>/dev/null || true

          if [ -f "merge_shards.py" ]; then
            MERGE_SCRIPT="merge_shards.py"
          else
            MERGE_SCRIPT="stock_data_downloader/merge_shards.py"
          fi

          python "$MERGE_SCRIPT" "$TARGET_DATE" "twse"

          FINAL_FILE=$(find output -name "api_absr1_*_twse.parquet" | head -n 1)
          if [ -n "$FINAL_FILE" ]; then
            BASENAME=$(basename "$FINAL_FILE" .parquet)
            echo "ARTIFACT_NAME=$BASENAME" >> $GITHUB_ENV
          else
            echo "ARTIFACT_NAME=api_absr1_twse_daily_parquet" >> $GITHUB_ENV
          fi

      - name: 上傳 TWSE 最終 Parquet 資料包與彙整 Log
        uses: actions/upload-artifact@v4
        with:
          name: twse-final-parquet
          path: |
            output/*_twse.parquet
            output/*-twse.log
            output/logs/*-twse.log
          retention-days: 7

  # -----------------------------------------------------------------
  # 聚合 TPEX：聚合分片 Parquet 並彙整 YYYY-MM-DD-tpex.log 上傳 GDrive
  # -----------------------------------------------------------------
  merge-tpex:
    name: 聚合 TPEX 上櫃資料庫與 Log 歸檔
    needs: [pre-check, tpex-canary, tpex-shards]
    if: ${{ always() && needs.pre-check.outputs.should_skip != 'true' && needs.tpex-canary.result == 'success' && needs.tpex-shards.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 檢出專案代碼 (Checkout)
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 安裝 Python 套件依賴
        run: |
          python -m pip install --upgrade pip
          if [ -f "requirements.txt" ]; then
            pip install -r requirements.txt
          else
            pip install -r stock_data_downloader/requirements.txt
          fi

      - name: 下載 TPEX 分片產物
        uses: actions/download-artifact@v4
        with:
          pattern: tpex-shard-*
          path: download_shards

      - name: 彙整 TPEX 分片為上櫃完整資料庫與 Log
        env:
          PYTHONIOENCODING: "utf-8"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GDRIVE_UPLOAD_URL: ${{ secrets.GDRIVE_UPLOAD_URL }}
          GDRIVE_SERVICE_ACCOUNT_KEY: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_KEY }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          GDRIVE_LOG_FOLDER_ID: ${{ secrets.GDRIVE_LOG_FOLDER_ID }}
          SMTP_SERVER: "smtp.gmail.com"
          SMTP_PORT: "587"
          SENDER_EMAIL: ${{ secrets.SMTP_USER }}
          SENDER_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          TARGET_DATE: ${{ github.event.inputs.target_date || needs.pre-check.outputs.target_date }}
        run: |
          mkdir -p download_shards output/logs
          find download_shards . -name "*_tpex_shard_*.parquet" -exec cp {} output/ \; 2>/dev/null || true
          find download_shards . -name "crawler_tpex_shard_*.log" -exec cp {} output/logs/ \; 2>/dev/null || true

          if [ -f "merge_shards.py" ]; then
            MERGE_SCRIPT="merge_shards.py"
          else
            MERGE_SCRIPT="stock_data_downloader/merge_shards.py"
          fi

          python "$MERGE_SCRIPT" "$TARGET_DATE" "tpex"

          FINAL_FILE=$(find output -name "api_absr1_*_tpex.parquet" | head -n 1)
          if [ -n "$FINAL_FILE" ]; then
            BASENAME=$(basename "$FINAL_FILE" .parquet)
            echo "ARTIFACT_NAME=$BASENAME" >> $GITHUB_ENV
          else
            echo "ARTIFACT_NAME=api_absr1_tpex_daily_parquet" >> $GITHUB_ENV
          fi

      - name: 上傳 TPEX 最終 Parquet 資料包與彙整 Log
        uses: actions/upload-artifact@v4
        with:
          name: tpex-final-parquet
          path: |
            output/*_tpex.parquet
            output/*-tpex.log
            output/*-tpse.log
            output/logs/*-tpex.log
            output/logs/*-tpse.log
          retention-days: 7

  # -----------------------------------------------------------------
  # 聚合全市場：將 TWSE 與 TPEX 資料庫合併為 api_absr1_YYYY-MM-DD_YYYY-MM-DD.parquet
  # -----------------------------------------------------------------
  merge-all:
    name: 整合 TWSE + TPEX 全市場資料庫並推播
    needs: [pre-check, merge-twse, merge-tpex]
    if: ${{ always() && needs.pre-check.outputs.should_skip != 'true' && (github.event_name == 'schedule' || github.event.inputs.market == 'all' || github.event.inputs.market == '') && (needs.merge-twse.result == 'success' || needs.merge-tpex.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 檢出專案代碼 (Checkout)
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 安裝 Python 套件依賴
        run: |
          python -m pip install --upgrade pip
          if [ -f "requirements.txt" ]; then
            pip install -r requirements.txt
          else
            pip install -r stock_data_downloader/requirements.txt
          fi

      - name: 下載上市與上櫃 Parquet 資料庫
        uses: actions/download-artifact@v4
        with:
          pattern: "*-final-parquet"
          path: download_shards

      - name: 整合為全市場單一資料庫 (api_absr1_YYYY-MM-DD_YYYY-MM-DD.parquet)
        env:
          PYTHONIOENCODING: "utf-8"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GDRIVE_UPLOAD_URL: ${{ secrets.GDRIVE_UPLOAD_URL }}
          GDRIVE_SERVICE_ACCOUNT_KEY: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_KEY }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          SMTP_SERVER: "smtp.gmail.com"
          SMTP_PORT: "587"
          SENDER_EMAIL: ${{ secrets.SMTP_USER }}
          SENDER_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          TARGET_DATE: ${{ github.event.inputs.target_date || needs.pre-check.outputs.target_date }}
        run: |
          mkdir -p download_shards output
          find download_shards . -name "api_absr1_*_twse.parquet" -exec cp {} output/ \; 2>/dev/null || true
          find download_shards . -name "api_absr1_*_tpex.parquet" -exec cp {} output/ \; 2>/dev/null || true

          if [ -f "merge_shards.py" ]; then
            MERGE_SCRIPT="merge_shards.py"
          else
            MERGE_SCRIPT="stock_data_downloader/merge_shards.py"
          fi

          python "$MERGE_SCRIPT" "$TARGET_DATE" "all"

          echo "[*] 正在執行輕量數據二次確認巡檢 (19:30 證交所融資券必就緒確認)..."
          if [ -n "$TARGET_DATE" ]; then
            python reconcile_lightweight_crawlers.py --date "$TARGET_DATE" || true
          else
            python reconcile_lightweight_crawlers.py || true
          fi

          FINAL_FILE=$(find output -maxdepth 1 -name "api_absr1_*.parquet" ! -name "*_twse.parquet" ! -name "*_tpex.parquet" | head -n 1)
          if [ -n "$FINAL_FILE" ]; then
            BASENAME=$(basename "$FINAL_FILE" .parquet)
            echo "ARTIFACT_NAME=$BASENAME" >> $GITHUB_ENV
          else
            echo "ARTIFACT_NAME=api_absr1_full_market_daily_parquet" >> $GITHUB_ENV
          fi

      - name: 上傳全市場最終 Parquet 資料包
        uses: actions/upload-artifact@v4
        with:
          name: full-market-final-parquet
          path: |
            output/api_absr1_*_*.parquet
          retention-days: 7
