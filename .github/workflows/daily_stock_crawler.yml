name: 每日全市場券商分點爬蟲排程

on:
  schedule:
    # 每週一至週五 台灣時間 20:30 (UTC 12:30)
    - cron: '30 12 * * 1-5'
  workflow_dispatch: # 支援在 GitHub 網頁手動一鍵觸發
    inputs:
      target_date:
        description: '指定抓取日期 (YYYY-MM-DD，留空則自動判斷最新交易日)'
        required: false
        default: ''
      market:
        description: '抓取市場 (all / twse / tpex)'
        required: true
        default: 'all'

jobs:
  run-crawler:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: 檢出專案代碼 (Checkout)
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 安裝系統依賴 (Chromium for TPEX)
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser chromium-chromedriver xvfb

      - name: 安裝 Python 套件依賴
        run: |
          pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          elif [ -f stock_data_downloader/requirements.txt ]; then
            pip install -r stock_data_downloader/requirements.txt
          fi
          pip install tensorflow

      - name: 執行全市場分點爬蟲 (5 輪安全補抓 + Telegram/Email 通知)
        env:
          PYTHONIOENCODING: "utf-8"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        run: |
          TARGET_DATE="${{ github.event.inputs.target_date }}"
          MARKET="${{ github.event.inputs.market }}"
          
          if [ -z "$MARKET" ]; then
            MARKET="all"
          fi
          
          if [ -f "stock_crawler_coordinator.py" ]; then
            TARGET_SCRIPT="stock_crawler_coordinator.py"
          elif [ -f "stock_data_downloader/stock_crawler_coordinator.py" ]; then
            TARGET_SCRIPT="stock_data_downloader/stock_crawler_coordinator.py"
          else
            TARGET_SCRIPT="dataProject/stock_crawler_coordinator.py"
          fi
          
          if [ -n "$TARGET_DATE" ]; then
            python "$TARGET_SCRIPT" --market "$MARKET" --date "$TARGET_DATE" --workers 4 --max-rounds 5 --no-excel
          else
            python "$TARGET_SCRIPT" --market "$MARKET" --workers 4 --max-rounds 5 --no-excel
          fi

          # 動態提取產出的 Parquet 檔名作為 Artifact 名稱 (如 api_absr1_2026-08-21_2026-08-21)
          PARQUET_PATH=$(find . -name "api_absr1_*.parquet" | head -n 1)
          if [ -n "$PARQUET_PATH" ]; then
            PARQUET_BASENAME=$(basename "$PARQUET_PATH" .parquet)
            echo "ARTIFACT_NAME=$PARQUET_BASENAME" >> $GITHUB_ENV
            echo "[*] 設定 Artifact 名稱為: $PARQUET_BASENAME"
          else
            echo "ARTIFACT_NAME=stock-bsr-parquet-${{ github.run_number }}" >> $GITHUB_ENV
          fi

      - name: 上傳成果為 GitHub Artifact (僅 Parquet，保留 7 天)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ env.ARTIFACT_NAME || 'api_absr1_daily_parquet' }}
          path: |
            **/output/*.parquet
          retention-days: 7
