name: 每日全市場券商分點爬蟲排程 (6-Runner 雲端分散極速版)

on:
  schedule:
    # 每週一至週五 台灣時間 20:30 (UTC 12:30)
    - cron: '30 12 * * 1-5'
  workflow_dispatch: # 支援在 GitHub 網頁手動一鍵觸發
    inputs:
      target_date:
        description: '指定抓取日期 (YYYY-MM-DD，留空則自動判斷最新交易日)'
        required: false
        default: ''
      market:
        description: '抓取市場 (all / twse / tpex)'
        required: true
        default: 'all'

jobs:
  crawler-shards:
    name: 雲端節點-分片-${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5] # 6 台完全獨立微軟雲端虛擬機 (6 個獨立 IP)

    steps:
      - name: 檢出專案代碼 (Checkout)
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 安裝系統依賴並啟動 Xvfb 虛擬桌面 (for TPEX 瀏覽器)
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser chromium-chromedriver xvfb
          Xvfb :99 -screen 0 1920x1080x24 &
          sleep 2

      - name: 安裝 Python 套件依賴
        run: |
          python -m pip install --upgrade pip
          if [ -f "requirements.txt" ]; then
            pip install -r requirements.txt
          elif [ -f "stock_data_downloader/requirements.txt" ]; then
            pip install -r stock_data_downloader/requirements.txt
          else
            pip install -r dataProject/requirements.txt
          fi

      - name: 執行分片爬蟲 (Shard ${{ matrix.shard }})
        env:
          DISPLAY: ":99"
          PYTHONIOENCODING: "utf-8"
          TARGET_DATE: ${{ github.event.inputs.target_date }}
          MARKET: ${{ github.event.inputs.market || 'all' }}
        run: |
          if [ -f "stock_crawler_coordinator.py" ]; then
            TARGET_SCRIPT="stock_crawler_coordinator.py"
          elif [ -f "stock_data_downloader/stock_crawler_coordinator.py" ]; then
            TARGET_SCRIPT="stock_data_downloader/stock_crawler_coordinator.py"
          else
            TARGET_SCRIPT="dataProject/stock_crawler_coordinator.py"
          fi
          
          if [ -n "$TARGET_DATE" ]; then
            python "$TARGET_SCRIPT" --market "$MARKET" --date "$TARGET_DATE" --workers 4 --max-rounds 5 --shard-id ${{ matrix.shard }} --num-shards 6 --no-excel
          else
            python "$TARGET_SCRIPT" --market "$MARKET" --workers 4 --max-rounds 5 --shard-id ${{ matrix.shard }} --num-shards 6 --no-excel
          fi

      - name: 上傳分片 Parquet 產物
        uses: actions/upload-artifact@v4
        with:
          name: shard-parquet-${{ matrix.shard }}
          path: |
            **/output/*_shard_*.parquet
          retention-days: 1

  merge-and-notify:
    name: 聚合全市場分點資料庫並推播
    needs: crawler-shards
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 檢出專案代碼 (Checkout)
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 安裝 Python 套件依賴
        run: |
          python -m pip install --upgrade pip
          if [ -f "requirements.txt" ]; then
            pip install -r requirements.txt
          else
            pip install -r stock_data_downloader/requirements.txt
          fi

      - name: 下載所有分片 Parquet 產物
        uses: actions/download-artifact@v4
        with:
          path: download_shards

      - name: 彙整所有分片為標準全市場資料庫
        env:
          PYTHONIOENCODING: "utf-8"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GDRIVE_SERVICE_ACCOUNT_KEY: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_KEY }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID || '1L6f9jQx9phz_ZoVfDmBQViEVnoDHh_0a' }}
          TARGET_DATE: ${{ github.event.inputs.target_date }}
        run: |
          mkdir -p output
          find download_shards -name "*.parquet" -exec cp {} output/ \;
          
          if [ -f "merge_shards.py" ]; then
            MERGE_SCRIPT="merge_shards.py"
          else
            MERGE_SCRIPT="stock_data_downloader/merge_shards.py"
          fi
          
          python "$MERGE_SCRIPT" "$TARGET_DATE"
          
          FINAL_FILE=$(find output -name "api_absr1_*.parquet" | head -n 1)
          if [ -n "$FINAL_FILE" ]; then
            BASENAME=$(basename "$FINAL_FILE" .parquet)
            echo "ARTIFACT_NAME=$BASENAME" >> $GITHUB_ENV
          else
            echo "ARTIFACT_NAME=api_absr1_daily_parquet" >> $GITHUB_ENV
          fi

      - name: 上傳最終全市場 Parquet 資料包 (保留 7 天)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME || 'api_absr1_daily_parquet' }}
          path: |
            output/*.parquet
          retention-days: 7
