name: 每日全市場券商分點爬蟲排程 v2 (TWSE 6-Runner v2 + TPEX 8-Runner + 全市場整合)

env:
  TZ: "Asia/Taipei"
  PYTHONIOENCODING: "utf-8"

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: "指定抓取日期 (YYYY-MM-DD，留空則自動判斷最新交易日)"
        required: false
        default: ""
      market:
        description: "抓取市場 (all / twse / tpex)"
        required: true
        default: "all"

  repository_dispatch:
    types: [trigger-daily-crawler-v2, run-daily-crawler-v2]

jobs:
  # -----------------------------------------------------------------
  # 前置檢查：判定是否為營業日與 Google Drive 查重
  # -----------------------------------------------------------------
  pre-check:
    name: 檢查 Google Drive 雲端資料庫狀態
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_skip: ${{ steps.check.outputs.should_skip }}
      target_date: ${{ steps.check.outputs.target_date }}

    steps:
      - name: 檢出專案代碼 (Checkout)
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安裝檢查依賴
        run: |
          pip install requests google-api-python-client google-auth

      - name: 判斷今日是否為台股營業日 (Trading Day Pre-check)
        id: trading_day_check
        run: |
          TARGET="${{ github.event.inputs.target_date }}"
          EVENT="${{ github.event_name }}"
          FORCE="${{ secrets.FORCE_CRAWL }}"
          
          if [ "$EVENT" = "workflow_dispatch" ] && [ -n "$TARGET" ]; then
            echo "[*] 手動指定日期 ($TARGET)，繼續後續流程。"
            echo "is_open=true" >> $GITHUB_OUTPUT
          elif [ "$FORCE" = "true" ]; then
            echo "[*] 檢測到 FORCE_CRAWL 旗標，繼續後續流程。"
            echo "is_open=true" >> $GITHUB_OUTPUT
          else
            if python trading_calendar.py --check-today; then
              echo "is_open=true" >> $GITHUB_OUTPUT
            else
              echo "is_open=false" >> $GITHUB_OUTPUT
              echo "[⏸️] 本日非台股開盤營業日，休市自動跳過後續所有抓取作業！"
            fi
          fi

      - name: 查詢 Google Drive 目標資料夾
        id: check
        env:
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          GDRIVE_UPLOAD_URL: ${{ secrets.GDRIVE_UPLOAD_URL }}
          GDRIVE_SERVICE_ACCOUNT_KEY: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_KEY }}
          SPECIFIED_DATE: ${{ github.event.inputs.target_date }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          CHECK_SCRIPT="check_gdrive_exists.py"
          if [ ! -f "$CHECK_SCRIPT" ]; then
            CHECK_SCRIPT="stock_data_downloader/check_gdrive_exists.py"
          fi

          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$SPECIFIED_DATE" ]; then
            echo "should_skip=false" >> $GITHUB_OUTPUT
            echo "target_date=$SPECIFIED_DATE" >> $GITHUB_OUTPUT
            echo "[*] 手動指定日期 ($SPECIFIED_DATE)，略過自動快篩。"
          else
            if [ "${{ steps.trading_day_check.outputs.is_open }}" = "false" ]; then
              echo "should_skip=true" >> $GITHUB_OUTPUT
              echo "target_date=$(python trading_calendar.py --latest 2>/dev/null || date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
              echo "[*] 休市日標記 should_skip=true，跳過本日排程。"
              exit 0
            fi
            python "$CHECK_SCRIPT" "$SPECIFIED_DATE"
          fi

  # -----------------------------------------------------------------
  # 每日收盤價採集 (TWSE + TPEX)
  # -----------------------------------------------------------------
  close-price:
    name: 每日收盤價採集 (TWSE + TPEX)
    needs: pre-check
    if: ${{ needs.pre-check.outputs.should_skip != 'true' && (github.event.inputs.market == 'all' || github.event.inputs.market == 'twse' || github.event.inputs.market == 'tpex' || github.event.inputs.market == '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 檢出專案代碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 安裝依賴
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 執行收盤價採集
        env:
          TARGET_DATE: ${{ github.event.inputs.target_date || needs.pre-check.outputs.target_date }}
        run: |
          python close_price_crawler.py --date "$TARGET_DATE"

      - name: 上傳收盤價產物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: close-price-parquet
          path: output/api_close1_*.parquet
          retention-days: 1

  # -----------------------------------------------------------------
  # 【全新 v2】TWSE 上市分點爬蟲 (4 個 Runner 獨立分片)
  # -----------------------------------------------------------------
  twse-shards:
    name: TWSE-上市-v2-分片-${{ matrix.shard }}
    needs: pre-check
    if: ${{ needs.pre-check.outputs.should_skip != 'true' && (github.event.inputs.market == 'all' || github.event.inputs.market == 'twse' || github.event.inputs.market == '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]

    steps:
      - name: 檢出專案代碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 安裝依賴
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 執行 TWSE v2 分片爬蟲 (Shard ${{ matrix.shard }} / 6)
        timeout-minutes: 30
        env:
          PYTHONIOENCODING: "utf-8"
          TARGET_DATE: ${{ github.event.inputs.target_date || needs.pre-check.outputs.target_date }}
        run: |
          python twse_crawler_v2.py --date "$TARGET_DATE" --shard-id ${{ matrix.shard }} --num-shards 6 --delay 0.6 --rounds 3

      - name: 上傳 TWSE v2 分片產物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twse-shard-${{ matrix.shard }}
          path: |
            output/api_absr1_*_twse_shard_${{ matrix.shard }}.parquet
            logs/crawler_twse_v2_*.log
          retention-days: 1

  # -----------------------------------------------------------------
  # 聚合 TWSE 上市分點 (調用全新 merge_twse_v2_shards.py)
  # -----------------------------------------------------------------
  merge-twse:
    name: 合併 TWSE 上市分片產物
    needs: [pre-check, twse-shards]
    if: ${{ needs.pre-check.outputs.should_skip != 'true' && needs.twse-shards.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 檢出專案代碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安裝依賴
        run: |
          pip install pandas pyarrow openpyxl requests

      - name: 下載所有 TWSE 分片產物
        uses: actions/download-artifact@v4
        with:
          path: download_shards
          pattern: twse-shard-*

      - name: 彙整分片檔案並執行合併
        env:
          TARGET_DATE: ${{ github.event.inputs.target_date || needs.pre-check.outputs.target_date }}
        run: |
          mkdir -p output logs
          find download_shards -name "*twse_shard_*.parquet" -exec cp {} output/ \; 2>/dev/null || true
          find download_shards -name "crawler_twse_v2_*.log" -exec cp {} logs/ \; 2>/dev/null || true
          python merge_twse_v2_shards.py "$TARGET_DATE" --search-dir output --output-dir output

      - name: 上傳 TWSE 最終上市總表
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twse-final-parquet
          path: |
            output/api_absr1_*_twse.parquet
            output/api_absr1_*_twse.xlsx
          retention-days: 1

  # -----------------------------------------------------------------
  # TPEX 前置探針：先用單一 Runner 驗證 WARP 通道與連線可用
  # -----------------------------------------------------------------
  tpex-probe:
    name: TPEX-上櫃-雲端探針
    needs: pre-check
    if: ${{ needs.pre-check.outputs.should_skip != 'true' && (github.event.inputs.market == 'all' || github.event.inputs.market == 'tpex' || github.event.inputs.market == '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 檢出專案代碼 (Checkout)
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 安裝系統依賴、Cloudflare WARP 通道與啟動 Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y curl gpg lsb-release xvfb
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update
          sudo apt-get install -y cloudflare-warp
          warp-cli --accept-tos registration new || warp-cli --accept-tos register
          warp-cli --accept-tos mode warp
          warp-cli --accept-tos connect
          sleep 3
          Xvfb :99 -screen 0 1920x1080x24 &
          sleep 1

      - name: 安裝 Python 套件依賴
        run: |
          python -m pip install --upgrade pip
          if [ -f "requirements_tpex_cloud.txt" ]; then
            pip install -r requirements_tpex_cloud.txt
          else
            pip install -r requirements.txt
          fi

      - name: 執行 TPEX 探針 (前 5 檔)
        env:
          DISPLAY: ":99"
          PYTHONIOENCODING: "utf-8"
          TARGET_DATE: ${{ github.event.inputs.target_date || needs.pre-check.outputs.target_date }}
        run: |
          python stock_crawler_coordinator.py --market tpex --date "$TARGET_DATE" --workers 1 --max-rounds 5 --shard-id 0 --num-shards 8 --limit-symbols 5 --no-excel

  # -----------------------------------------------------------------
  # TPEX 上櫃完整分片金絲雀：先由單一 Runner 跑完 Shard 0 (約 125 檔)，驗證長跑與會話穩定性
  # -----------------------------------------------------------------
  tpex-canary:
    name: TPEX-上櫃-完整分片金絲雀-0
    needs: [pre-check, tpex-probe]
    if: ${{ needs.pre-check.outputs.should_skip != 'true' && needs.tpex-probe.result == 'success' && (github.event.inputs.market == 'all' || github.event.inputs.market == 'tpex' || github.event.inputs.market == '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 檢出專案代碼 (Checkout)
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 安裝系統依賴、Cloudflare WARP 通道與啟動 Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y curl gpg lsb-release xvfb
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update
          sudo apt-get install -y cloudflare-warp
          warp-cli --accept-tos registration new || warp-cli --accept-tos register
          warp-cli --accept-tos mode warp
          warp-cli --accept-tos connect
          sleep 3
          Xvfb :99 -screen 0 1920x1080x24 &
          sleep 1

      - name: 安裝 Python 套件依賴
        run: |
          python -m pip install --upgrade pip
          if [ -f "requirements_tpex_cloud.txt" ]; then
            pip install -r requirements_tpex_cloud.txt
          else
            pip install -r requirements.txt
          fi

      - name: 執行 TPEX 上櫃完整分片金絲雀 (Shard 0)
        env:
          DISPLAY: ":99"
          PYTHONIOENCODING: "utf-8"
          PYTHONUNBUFFERED: "1"
          TPEX_CI_ABORT_AFTER_CONSECUTIVE_FAILURES: "0"
          TPEX_CANARY_ATTEMPTS: "2"
          TPEX_CANARY_RETRY_COOLDOWN_SECONDS: "180"
          TARGET_DATE: ${{ github.event.inputs.target_date || needs.pre-check.outputs.target_date }}
        run: |
          if [ -f "stock_crawler_coordinator.py" ]; then
            TARGET_SCRIPT="stock_crawler_coordinator.py"
          else
            TARGET_SCRIPT="stock_data_downloader/stock_crawler_coordinator.py"
          fi

          ATTEMPTS="${TPEX_CANARY_ATTEMPTS:-2}"
          COOLDOWN="${TPEX_CANARY_RETRY_COOLDOWN_SECONDS:-180}"
          set +e
          for attempt in $(seq 1 "$ATTEMPTS"); do
            echo "[*] TPEX canary shard attempt ${attempt}/${ATTEMPTS}"
            if [ -n "$TARGET_DATE" ]; then
              python "$TARGET_SCRIPT" --market tpex --date "$TARGET_DATE" --workers 1 --max-rounds 3 --shard-id 0 --num-shards 8 --no-excel
            else
              python "$TARGET_SCRIPT" --market tpex --workers 1 --max-rounds 3 --shard-id 0 --num-shards 8 --no-excel
            fi
            rc=$?
            if [ "$rc" -eq 0 ]; then
              echo "[✓] TPEX canary shard attempt ${attempt}/${ATTEMPTS} passed."
              exit 0
            fi

            echo "[!] TPEX canary shard attempt ${attempt}/${ATTEMPTS} failed with exit code ${rc}."
            if [ "$attempt" -lt "$ATTEMPTS" ]; then
              echo "[*] Cooling down ${COOLDOWN}s and rotating WARP/Chromium before retrying canary shard..."
              rm -rf output/*_tpex_shard_0.parquet output/logs/crawler_tpex_shard_0.log logs/crawler_tpex_shard_0.log downloads_tpex_cloud || true
              pkill -9 -f 'chrome|chromium' 2>/dev/null || true
              warp-cli --accept-tos disconnect 2>/dev/null || true
              warp-cli --accept-tos registration new 2>/dev/null || warp-cli --accept-tos register 2>/dev/null || true
              sleep 8
              warp-cli --accept-tos connect 2>/dev/null || true
              sleep "$COOLDOWN"
            fi
          done

          echo "[!] TPEX canary shard failed after ${ATTEMPTS} attempts."
          exit 1

      - name: 上傳 TPEX 金絲雀分片產物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tpex-shard-0
          path: |
            **/output/*_tpex_shard_0.parquet
            **/output/logs/crawler_tpex_shard_0.log
            **/logs/crawler_tpex_shard_0.log
          retention-days: 1

  # -----------------------------------------------------------------
  # TPEX 上櫃：金絲雀成功後展開其餘 7 個 Runner 矩陣分片 (Shard 1~7)
  # -----------------------------------------------------------------
  tpex-shards:
    name: TPEX-上櫃-分片-${{ matrix.shard }}
    needs: [pre-check, tpex-probe, tpex-canary]
    if: ${{ needs.pre-check.outputs.should_skip != 'true' && needs.tpex-probe.result == 'success' && needs.tpex-canary.result == 'success' && (github.event.inputs.market == 'all' || github.event.inputs.market == 'tpex' || github.event.inputs.market == '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7]

    steps:
      - name: 檢出專案代碼 (Checkout)
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 安裝系統依賴、Cloudflare WARP 通道與啟動 Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y curl gpg lsb-release xvfb
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update
          sudo apt-get install -y cloudflare-warp
          warp-cli --accept-tos registration new || warp-cli --accept-tos register
          warp-cli --accept-tos mode warp
          warp-cli --accept-tos connect
          sleep 3
          Xvfb :99 -screen 0 1920x1080x24 &
          sleep 1

      - name: 安裝 Python 套件依賴
        run: |
          python -m pip install --upgrade pip
          if [ -f "requirements_tpex_cloud.txt" ]; then
            pip install -r requirements_tpex_cloud.txt
          else
            pip install -r requirements.txt
          fi

      - name: 執行 TPEX 上櫃分片爬蟲 (Shard ${{ matrix.shard }}/8)
        env:
          DISPLAY: ":99"
          PYTHONIOENCODING: "utf-8"
          PYTHONUNBUFFERED: "1"
          TPEX_CI_ABORT_AFTER_CONSECUTIVE_FAILURES: "0"
          TPEX_SHARD_ATTEMPTS: "2"
          TPEX_SHARD_RETRY_COOLDOWN_SECONDS: "300"
          TARGET_DATE: ${{ github.event.inputs.target_date || needs.pre-check.outputs.target_date }}
        run: |
          if [ -f "stock_crawler_coordinator.py" ]; then
            TARGET_SCRIPT="stock_crawler_coordinator.py"
          else
            TARGET_SCRIPT="stock_data_downloader/stock_crawler_coordinator.py"
          fi

          # 7 分片錯峰啟動 (每分片錯開 15s)；在單路串行下維持溫和節奏，避免同時撞擊 TPEX 首頁與 Session 握手
          sleep $(( ${{ matrix.shard }} * 15 ))

          ATTEMPTS="${TPEX_SHARD_ATTEMPTS:-2}"
          COOLDOWN="${TPEX_SHARD_RETRY_COOLDOWN_SECONDS:-300}"
          set +e
          for attempt in $(seq 1 "$ATTEMPTS"); do
            echo "[*] TPEX shard ${{ matrix.shard }} attempt ${attempt}/${ATTEMPTS}"
            if [ -n "$TARGET_DATE" ]; then
              python "$TARGET_SCRIPT" --market tpex --date "$TARGET_DATE" --workers 1 --max-rounds 3 --shard-id ${{ matrix.shard }} --num-shards 8 --no-excel
            else
              python "$TARGET_SCRIPT" --market tpex --workers 1 --max-rounds 3 --shard-id ${{ matrix.shard }} --num-shards 8 --no-excel
            fi
            rc=$?
            if [ "$rc" -eq 0 ]; then
              echo "[✓] TPEX shard ${{ matrix.shard }} attempt ${attempt}/${ATTEMPTS} passed."
              exit 0
            fi

            echo "[!] TPEX shard ${{ matrix.shard }} attempt ${attempt}/${ATTEMPTS} failed with exit code ${rc}."
            if [ "$attempt" -lt "$ATTEMPTS" ]; then
              echo "[*] Cooling down ${COOLDOWN}s and rotating WARP/Chromium before retrying shard ${{ matrix.shard }}..."
              rm -rf output/*_tpex_shard_${{ matrix.shard }}.parquet output/logs/crawler_tpex_shard_${{ matrix.shard }}.log logs/crawler_tpex_shard_${{ matrix.shard }}.log downloads_tpex_cloud || true
              pkill -9 -f 'chrome|chromium' 2>/dev/null || true
              warp-cli --accept-tos disconnect 2>/dev/null || true
              warp-cli --accept-tos registration new 2>/dev/null || warp-cli --accept-tos register 2>/dev/null || true
              sleep 8
              warp-cli --accept-tos connect 2>/dev/null || true
              sleep "$COOLDOWN"
            fi
          done

          echo "[!] TPEX shard ${{ matrix.shard }} failed after ${ATTEMPTS} attempts."
          exit 1

      - name: 上傳 TPEX 分片產物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tpex-shard-${{ matrix.shard }}
          path: |
            **/output/*_tpex_shard_*.parquet
            **/output/logs/crawler_tpex_shard_*.log
            **/logs/crawler_tpex_shard_*.log
          retention-days: 1

  # -----------------------------------------------------------------
  # 聚合 TPEX 上櫃分點 (結合 Canary Shard 0 與 Matrix Shards 1~7)
  # -----------------------------------------------------------------
  merge-tpex:
    name: 合併 TPEX 上櫃分片產物
    needs: [pre-check, tpex-canary, tpex-shards]
    if: ${{ needs.pre-check.outputs.should_skip != 'true' && needs.tpex-canary.result == 'success' && needs.tpex-shards.result == 'success' && (github.event.inputs.market == 'all' || github.event.inputs.market == 'tpex' || github.event.inputs.market == '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 檢出專案代碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安裝依賴
        run: |
          pip install pandas pyarrow openpyxl requests

      - name: 下載 TPEX 分片產物
        uses: actions/download-artifact@v4
        with:
          path: download_shards
          pattern: tpex-shard-*

      - name: 彙整 TPEX 分片
        env:
          TARGET_DATE: ${{ github.event.inputs.target_date || needs.pre-check.outputs.target_date }}
        run: |
          mkdir -p output output/logs
          find download_shards -name "*_tpex_shard_*.parquet" -exec cp {} output/ \; 2>/dev/null || true
          find download_shards -name "crawler_tpex_shard_*.log" -exec cp {} output/logs/ \; 2>/dev/null || true
          python merge_shards.py "$TARGET_DATE" "tpex"

      - name: 上傳 TPEX 最終上櫃總表
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tpex-final-parquet
          path: |
            output/api_absr1_*_tpex.parquet
            output/api_absr1_*_tpex.xlsx
          retention-days: 1

  # -----------------------------------------------------------------
  # 全市場母表整合作業 (上市 + 上櫃合併 + Google Drive 備份)
  # -----------------------------------------------------------------
  merge-all:
    name: 全市場母表整合與雲端備份
    needs: [pre-check, merge-twse, merge-tpex]
    if: ${{ always() && needs.pre-check.outputs.should_skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 檢出專案代碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安裝依賴
        run: |
          pip install pandas pyarrow openpyxl requests google-api-python-client google-auth

      - name: 下載上市與上櫃總表
        uses: actions/download-artifact@v4
        with:
          pattern: "*-final-parquet"
          path: output
          merge-multiple: true

      - name: 執行全市場母表合併
        env:
          TARGET_DATE: ${{ github.event.inputs.target_date || needs.pre-check.outputs.target_date }}
        run: |
          mkdir -p output
          find output -name "api_absr1_*.parquet" -exec cp -n {} output/ \; 2>/dev/null || true
          python merge_shards.py "$TARGET_DATE" "all"

      - name: 備份至 Google Drive
        if: always()
        env:
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          GDRIVE_UPLOAD_URL: ${{ secrets.GDRIVE_UPLOAD_URL }}
          GDRIVE_SERVICE_ACCOUNT_KEY: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_KEY }}
          TARGET_DATE: ${{ github.event.inputs.target_date || needs.pre-check.outputs.target_date }}
        run: |
          python gdrive_sync.py --date "$TARGET_DATE" || true

      - name: 發送 Telegram 推播通知
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TARGET_DATE: ${{ github.event.inputs.target_date || needs.pre-check.outputs.target_date }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}" \
              -d "text=🚀 [台股爬蟲 v2 全市場] ${TARGET_DATE} 雲端採集任務執行完畢！" || true
          fi
