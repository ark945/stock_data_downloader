name: TPEX 雲端單檔診斷測試

on:
  workflow_dispatch:
    inputs:
      code:
        description: "測試代碼"
        required: false
        default: "1240"

jobs:
  test-tpex:
    runs-on: ubuntu-latest
    steps:
      - name: 檢出專案代碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安裝 Cloudflare WARP 住宅級消費者網絡通道
        run: |
          sudo apt-get update
          sudo apt-get install -y curl gpg lsb-release xvfb
          
          # 安裝 Cloudflare WARP 官方套件
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          
          sudo apt-get update
          sudo apt-get install -y cloudflare-warp
          
          # 註冊並連接 WARP 網絡
          warp-cli --accept-tos registration new || warp-cli --accept-tos register
          warp-cli --accept-tos mode warp
          warp-cli --accept-tos connect
          
          sleep 3
          echo "=== 檢查當前連線 IP 與 WARP 狀態 ==="
          curl -s https://cloudflare.com/cdn-cgi/trace
          warp-cli --accept-tos status

      - name: 安裝 Python 依賴
        run: |
          pip install DrissionPage pandas requests

      - name: 啟動 Xvfb 並在 WARP 通道下執行 TPEX 採集測試
        run: |
          Xvfb :99 -screen 0 1920x1080x24 &
          export DISPLAY=:99
          python test_cloud_diagnostics.py
