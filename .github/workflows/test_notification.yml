name: 通知推播連線測試 (Telegram & Email)

on:
  schedule:
    # 每天早上 台灣時間 06:30 (UTC 22:30 前一天)
    - cron: "30 22 * * *"
  workflow_dispatch: # 支援在 GitHub 網頁手動一鍵觸發測試

jobs:
  test-notification:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 檢出專案代碼 (Checkout)
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 安裝基礎依賴 (Requests)
        run: |
          pip install --upgrade pip
          pip install requests

      - name: 執行通知連線測試
        env:
          PYTHONIOENCODING: "utf-8"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_SERVER: "smtp.gmail.com"
          SMTP_PORT: "587"
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        run: |
          if [ -f "test_notify.py" ]; then
            python test_notify.py
          elif [ -f "stock_data_downloader/test_notify.py" ]; then
            python stock_data_downloader/test_notify.py
          else
            echo "❌ 找不到 test_notify.py 測試腳本"
            exit 1
          fi
