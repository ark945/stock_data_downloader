name: Google Drive 雲端同步連線測試

on:
  workflow_dispatch: # 支援在 GitHub 網頁手動一鍵觸發測試

jobs:
  test-gdrive:
    name: 測試 Google Drive API 連線與寫入權限
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 檢出專案代碼 (Checkout)
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 安裝 Google Drive 官方 API 依賴
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth

      - name: 執行 Google Drive 連線與權限測試
        env:
          PYTHONIOENCODING: "utf-8"
          GDRIVE_SERVICE_ACCOUNT_KEY: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_KEY }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          if [ -f "test_gdrive.py" ]; then
            python test_gdrive.py
          elif [ -f "stock_data_downloader/test_gdrive.py" ]; then
            python stock_data_downloader/test_gdrive.py
          else
            echo "❌ 找不到 test_gdrive.py 測試腳本"
            exit 1
          fi
